name: Harness and product verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Harness and product verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run harness and required product checks
        run: bash scripts/verify.sh
