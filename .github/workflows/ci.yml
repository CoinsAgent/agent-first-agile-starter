name: Harness and product verification

# Inline JSON is valid YAML and lets the standard-library tests exercise this
# trigger matrix. Open the story PR only after explicit human result approval.
on: {"pull_request": {"branches": ["main"], "types": ["opened", "synchronize", "reopened"]}}

permissions:
  contents: read

jobs:
  verify:
    name: Harness and product verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check dependency download sources
        run: node scripts/check-lockfile.mjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run harness and required product checks
        run: bash scripts/verify.sh

  path-scope:
    name: PR path scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check complete proposed scope (human authorization is separate)
        env:
          SCOPE_BASE: ${{ github.event.pull_request.base.sha }}
          SCOPE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_scope.py --base "$SCOPE_BASE" --head "$SCOPE_HEAD" --discover-scope
